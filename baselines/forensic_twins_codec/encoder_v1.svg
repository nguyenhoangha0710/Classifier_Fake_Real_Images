<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450"><rect width="1200" height="1450" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs><path d="M600 160 V175 H600 V190" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 255 V277.5 H310 V300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 255 V277.5 H890 V300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M310 375 V470 H310 V565" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M890 375 V387.5 H890 V400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M890 525 V545 H890 V565" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M310 620 V635 H310 V650" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M890 620 V635 H890 V650" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M310 720 V740 H600 V760" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M890 720 V740 H600 V760" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 840 V862.5 H600 V885" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 995 V1017.5 H600 V1040" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 1125 V1147.5 H600 V1170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="70" y="20" width="1060" height="55" rx="12" fill="#ffffff" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0f172a"><tspan x="600" y="40" font-weight="700">FORENSIC TWINS — NATIVE vs RANDOM CODEC</tspan><tspan x="600" y="65" font-weight="400">Bản nháp v1 • SSL chỉ dùng ảnh real</tspan></text></g><g><rect x="410" y="95" width="380" height="65" rx="12" fill="#dbeafe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="600" y="122.5" font-weight="700">Ảnh real RGB • giữ kích thước gốc</tspan><tspan x="600" y="142.5" font-weight="400">Decode → RGB [0,1]</tspan></text></g><g><rect x="410" y="190" width="380" height="65" rx="12" fill="#dbeafe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="600" y="217.5" font-weight="700">Shared rotation / flip</tspan><tspan x="600" y="237.5" font-weight="400">Cùng phép biến đổi cho cả hai view</tspan></text></g><g><rect x="100" y="300" width="420" height="75" rx="12" fill="#dcfce7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="310" y="332.5" font-weight="700">VIEW 1 — NATIVE</tspan><tspan x="310" y="352.5" font-weight="400">Identity: không re-encode / resize</tspan></text></g><g><rect x="680" y="300" width="420" height="75" rx="12" fill="#ffedd5" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="890" y="332.5" font-weight="700">VIEW 2 — RANDOM PROCESSING</tspan><tspan x="890" y="352.5" font-weight="400">Sample policy riêng cho từng ảnh</tspan></text></g><g><rect x="680" y="400" width="420" height="125" rx="12" fill="#fff7ed" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="890" y="427.5" font-weight="700">CẤU HÌNH THỬ NGHIỆM</tspan><tspan x="890" y="447.5" font-weight="400">50% JPEG • Q ~ Uniform integer [60,100]</tspan><tspan x="890" y="467.5" font-weight="400">35% downscale–upscale (s=0.75–1.0) → JPEG</tspan><tspan x="890" y="487.5" font-weight="400">15% identity • output giữ W×H</tspan><tspan x="890" y="507.5" font-weight="400">Random interpolation / JPEG subsampling</tspan></text></g><g><rect x="100" y="565" width="420" height="55" rx="12" fill="#f1f5f9" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="310" y="597.5" font-weight="700">Grayscale • float [0,1]</tspan></text></g><g><rect x="680" y="565" width="420" height="55" rx="12" fill="#f1f5f9" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="890" y="597.5" font-weight="700">Grayscale • float [0,1]</tspan></text></g><g><rect x="100" y="650" width="420" height="70" rx="12" fill="#e2e8f0" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="310" y="680" font-weight="700">FRE — FROZEN</tspan><tspan x="310" y="700" font-weight="400">1→8 channels • kernel 15 • padding 7</tspan></text></g><g><rect x="680" y="650" width="420" height="70" rx="12" fill="#e2e8f0" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="890" y="680" font-weight="700">FRE — FROZEN</tspan><tspan x="890" y="700" font-weight="400">Cùng checkpoint / weights với view 1</tspan></text></g><g><rect x="240" y="760" width="720" height="80" rx="12" fill="#fef3c7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="600" y="785" font-weight="700">SHARED DISJOINT CROP SAMPLER</tspan><tspan x="600" y="805" font-weight="400">Sample hai rectangle A và B trên cùng hệ tọa độ: A ∩ B = ∅</tspan><tspan x="600" y="825" font-weight="400">Crop A từ residual view 1; crop B từ residual view 2</tspan></text></g><g><rect x="240" y="885" width="720" height="110" rx="12" fill="#ede9fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="600" y="905" font-weight="700">SHARED ViT-TINY ENCODER fθ — TRAINABLE</tspan><tspan x="600" y="925" font-weight="400">Hai forward, cùng một bộ trọng số</tspan><tspan x="600" y="945" font-weight="400">8-channel input → linear patch embedding (patch 8)</tspan><tspan x="600" y="965" font-weight="400">[CLS] + 2D RoPE → 6 Transformer blocks → LayerNorm</tspan><tspan x="600" y="985" font-weight="400">z₁, z₂: B×192</tspan></text></g><g><rect x="240" y="1040" width="720" height="85" rx="12" fill="#ede9fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="600" y="1067.5" font-weight="700">SHARED PROJECTOR gφ — TRAINABLE</tspan><tspan x="600" y="1087.5" font-weight="400">192 → 2048 → 8192 • theo implementation hiện tại</tspan><tspan x="600" y="1107.5" font-weight="400">e₁, e₂: B×8192</tspan></text></g><g><rect x="240" y="1170" width="720" height="80" rx="12" fill="#fee2e2" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="600" y="1195" font-weight="700">BARLOW TWINS LOSS</tspan><tspan x="600" y="1215" font-weight="400">Chuẩn hóa feature trên global batch → C = E₁ᵀE₂ / B</tspan><tspan x="600" y="1235" font-weight="400">L = Σᵢ(1−Cᵢᵢ)² + λ Σᵢ≠ⱼ Cᵢⱼ² • λ = 5×10⁻⁵</tspan></text></g><g><rect x="70" y="1300" width="1060" height="100" rx="12" fill="#f8fafc" stroke="#64748b"/><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="600" y="1315" font-weight="700">CHECKPOINT &amp; PHẠM VI</tspan><tspan x="600" y="1335" font-weight="400">Warm-start encoder + projector nếu có; FRE luôn frozen. Reset optimizer / LR schedule khi fine-tune.</tspan><tspan x="600" y="1355" font-weight="400">Sau train: bỏ projector, dùng encoder 192-D; fit lại GMM bằng checkpoint mới.</tspan><tspan x="600" y="1375" font-weight="400">Giữ inference native cho so sánh đầu tiên. Codec invariance là giả thuyết cần kiểm chứng.</tspan><tspan x="600" y="1395" font-weight="400">Native real JPEG vẫn có lịch sử nén; augmentation không tạo ra real lossless thật.</tspan></text></g></svg>
