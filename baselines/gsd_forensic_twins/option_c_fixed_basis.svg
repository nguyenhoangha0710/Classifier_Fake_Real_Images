<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1300" viewBox="0 0 1500 1300"><rect width="1500" height="1300" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs><path d="M320 180 V202.5 H150 V225" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M320 180 V202.5 H490 V225" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M150 290 V317.5 H320 V345" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M490 290 V317.5 H320 V345" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M320 420 V442.5 H320 V465" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M320 530 V555 H320 V580" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M320 660 V690 H320 V720" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M320 800 V830 H320 V860" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M320 930 V960 H320 V990" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1080 275 V295 H1080 V315" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1080 400 V422.5 H1080 V445" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1080 525 V547.5 H1080 V570" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1080 645 V675 H1240 V705" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M960 742 H1050" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1240 785 V812.5 H1240 V840" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M840 775 V877 H1050" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1240 915 V940 H1240 V965" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M550 760 H660 V742 H720" stroke="#64748b" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/><rect x="30" y="20" width="1440" height="55" rx="10" fill="#ffffff" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a"><tspan x="750" y="52.5" font-weight="700">PHƯƠNG ÁN C — WORKFLOW CHÍNH &amp; CHI TIẾT SHARED GSD</tspan></text><rect x="140" y="115" width="360" height="65" rx="10" fill="#dbeafe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="320" y="142.5" font-weight="700">Real RGB → shared rotation / flip</tspan><tspan x="320" y="162.5" font-weight="400">SSL chỉ dùng real training images</tspan></text><rect x="30" y="225" width="240" height="65" rx="10" fill="#dcfce7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="150" y="252.5" font-weight="700">VIEW 1 — NATIVE</tspan><tspan x="150" y="272.5" font-weight="400">Identity</tspan></text><rect x="370" y="225" width="240" height="65" rx="10" fill="#ffedd5" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="490" y="252.5" font-weight="700">VIEW 2 — RANDOM</tspan><tspan x="490" y="272.5" font-weight="400">Processing giữ W × H</tspan></text><rect x="90" y="345" width="460" height="75" rx="10" fill="#fef3c7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="320" y="367.5" font-weight="700">SHARED DISJOINT CROP SAMPLER</tspan><tspan x="320" y="387.5" font-weight="400">A từ view 1, B từ view 2 • A ∩ B = ∅</tspan><tspan x="320" y="407.5" font-weight="400">Hai crop RGB riêng</tspan></text><rect x="90" y="465" width="460" height="65" rx="10" fill="#f1f5f9" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="320" y="492.5" font-weight="700">CLIP PREPROCESSING</tspan><tspan x="320" y="512.5" font-weight="400">Input resolution + RGB normalization</tspan></text><rect x="90" y="580" width="460" height="80" rx="10" fill="#ede9fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="320" y="605" font-weight="700">SHARED TRAINABLE CLIP Ef</tspan><tspan x="320" y="625" font-weight="400">Hai forward, cùng weights</tspan><tspan x="320" y="645" font-weight="400">CLS: z₁, z₂ ∈ ℝ^(B×d)</tspan></text><rect x="90" y="720" width="460" height="80" rx="10" fill="#fef3c7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="320" y="745" font-weight="700">SHARED GSD</tspan><tspan x="320" y="765" font-weight="400">Input: z₁, z₂ → output: ẑ₁, ẑ₂</tspan><tspan x="320" y="785" font-weight="400">Cùng basis U và suppression strength α</tspan></text><rect x="90" y="860" width="460" height="70" rx="10" fill="#ede9fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="320" y="880" font-weight="700">SHARED TRAINABLE PROJECTOR</tspan><tspan x="320" y="900" font-weight="400">d → hidden → D</tspan><tspan x="320" y="920" font-weight="400">Output: e₁, e₂ ∈ ℝ^(B×D)</tspan></text><rect x="90" y="990" width="460" height="100" rx="10" fill="#fee2e2" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="320" y="1015" font-weight="700">NORMALIZE → BARLOW TWINS LOSS</tspan><tspan x="320" y="1035" font-weight="400">Chuẩn hóa trên global batch</tspan><tspan x="320" y="1055" font-weight="400">C = normalized(E₁)ᵀ normalized(E₂) / B</tspan><tspan x="320" y="1075" font-weight="400">LBT = Σᵢ(1−Cᵢᵢ)² + λBT Σᵢ≠ⱼCᵢⱼ²</tspan></text><rect x="730" y="110" width="700" height="55" rx="10" fill="#ffffff" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1080" y="142.5" font-weight="700">BÊN TRONG SHARED GSD — FIXED REFERENCE BASIS</tspan></text><rect x="860" y="205" width="440" height="70" rx="10" fill="#e0f2fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1080" y="235" font-weight="700">1. OFFLINE: REAL REFERENCE SET</tspan><tspan x="1080" y="255" font-weight="400">Chỉ thuộc training split • Nref ảnh</tspan></text><rect x="860" y="315" width="440" height="85" rx="10" fill="#e2e8f0" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1080" y="342.5" font-weight="700">FROZEN CLIP Es • eval / no_grad</tspan><tspan x="1080" y="362.5" font-weight="400">Cùng pretrained initialization với Ef</tspan><tspan x="1080" y="382.5" font-weight="400">CLS trước CLIP projection head: S ∈ ℝ^(Nref×d)</tspan></text><rect x="860" y="445" width="440" height="80" rx="10" fill="#fef3c7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1080" y="470" font-weight="700">SVD KHÔNG CENTERING</tspan><tspan x="1080" y="490" font-weight="400">S = AΣVᵀ → U = V[:, :K]</tspan><tspan x="1080" y="510" font-weight="400">U ∈ ℝ^(d×K) • UᵀU = I</tspan></text><rect x="860" y="570" width="440" height="75" rx="10" fill="#fef3c7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1080" y="592.5" font-weight="700">LƯU BASIS U • STOP-GRADIENT</tspan><tspan x="1080" y="612.5" font-weight="400">Tính một lần, cố định khi train / inference</tspan><tspan x="1080" y="632.5" font-weight="400">Es không cần chạy online</tspan></text><rect x="720" y="710" width="240" height="65" rx="10" fill="#ede9fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="840" y="737.5" font-weight="700">2. ONLINE INPUT</tspan><tspan x="840" y="757.5" font-weight="400">zᵥ ∈ ℝ^(B×d) • v=1,2</tspan></text><rect x="1050" y="705" width="380" height="80" rx="10" fill="#fef3c7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1240" y="730" font-weight="700">CHIẾU LÊN SEMANTIC SUBSPACE</tspan><tspan x="1240" y="750" font-weight="400">pᵥ = (zᵥU)Uᵀ</tspan><tspan x="1240" y="770" font-weight="400">Dùng chung U cho cả hai view</tspan></text><rect x="1050" y="840" width="380" height="75" rx="10" fill="#fef3c7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1240" y="862.5" font-weight="700">SUPPRESS THÀNH PHẦN ĐƯỢC CHIẾU</tspan><tspan x="1240" y="882.5" font-weight="400">ẑᵥ = zᵥ − αpᵥ</tspan><tspan x="1240" y="902.5" font-weight="400">α cố định theo từng run</tspan></text><rect x="1050" y="965" width="380" height="70" rx="10" fill="#dcfce7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1240" y="985" font-weight="700">OUTPUT: ẑ₁, ẑ₂ ∈ ℝ^(B×d)</tspan><tspan x="1240" y="1005" font-weight="400">Gradient truyền về Ef qua zᵥ</tspan><tspan x="1240" y="1025" font-weight="400">U không được cập nhật</tspan></text><rect x="720" y="1095" width="710" height="120" rx="10" fill="#f8fafc" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1075" y="1120" font-weight="700">QUY ƯỚC THIẾT KẾ</tspan><tspan x="1075" y="1140" font-weight="400">Shared GSD = cùng phép toán, U và α; không trộn hai view.</tspan><tspan x="1075" y="1160" font-weight="400">Đây là biến thể lấy cảm hứng từ GSD, suppression cuối encoder.</tspan><tspan x="1075" y="1180" font-weight="400">Fit GMM / inference: Ef → cùng Shared GSD → GMM; bỏ projector.</tspan><tspan x="1075" y="1200" font-weight="400">Control B: α=0. K, α, backbone, crop size và projector cần chốt.</tspan></text><rect x="30" y="1150" width="580" height="100" rx="10" fill="#fff7ed" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="320" y="1175" font-weight="700">RANDOM PROCESSING — CẤU HÌNH KHỞI ĐẦU</tspan><tspan x="320" y="1195" font-weight="400">50% JPEG Q∈[80,100]; 35% down/up s∈[0.75,1] → JPEG</tspan><tspan x="320" y="1215" font-weight="400">15% identity; random interpolation / JPEG subsampling</tspan><tspan x="320" y="1235" font-weight="400">Mọi nhánh giữ kích thước gốc trước crop.</tspan></text></svg>
