<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1340" viewBox="0 0 1620 1340"><rect width="1620" height="1340" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs><path d="M350 180 V202.5 H160 V225" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M350 180 V202.5 H530 V225" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M160 290 V317.5 H345 V345" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M530 290 V317.5 H345 V345" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M345 425 V460 H345 V495" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M345 595 V640 H345 V685" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M345 765 V810 H345 V855" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1160 275 V302.5 H935 V330" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1160 275 V302.5 H1385 V330" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M935 415 V440 H935 V465" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1385 415 V440 H1385 V465" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M935 545 V572.5 H935 V600" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M935 695 V725 H1200 V755" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1385 545 V650 H1200 V755" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1200 840 V870 H1200 V900" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M580 545 H700 V140 H760" stroke="#64748b" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/><rect x="30" y="15" width="1560" height="60" rx="10" fill="#ffffff" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a"><tspan x="810" y="40" font-weight="700">PHƯƠNG ÁN C — GSD VỚI BASIS RIÊNG CHO TỪNG VIEW</tspan><tspan x="810" y="60" font-weight="400">Bản đề xuất: per-crop patch-token SVD, suppression cuối encoder</tspan></text><rect x="155" y="115" width="390" height="65" rx="10" fill="#dbeafe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="350" y="142.5" font-weight="700">Real RGB → shared rotation / flip</tspan><tspan x="350" y="162.5" font-weight="400">SSL pretraining chỉ dùng real</tspan></text><rect x="30" y="225" width="260" height="65" rx="10" fill="#dcfce7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="160" y="252.5" font-weight="700">VIEW 1 — NATIVE</tspan><tspan x="160" y="272.5" font-weight="400">Identity</tspan></text><rect x="400" y="225" width="260" height="65" rx="10" fill="#ffedd5" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="530" y="252.5" font-weight="700">VIEW 2 — RANDOM PROCESSING</tspan><tspan x="530" y="272.5" font-weight="400">Output giữ W × H</tspan></text><rect x="110" y="345" width="470" height="80" rx="10" fill="#fef3c7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="345" y="370" font-weight="700">SHARED DISJOINT CROP SAMPLER</tspan><tspan x="345" y="390" font-weight="400">Crop A từ view 1, crop B từ view 2 • A ∩ B = ∅</tspan><tspan x="345" y="410" font-weight="400">RGB → CLIP preprocessing cho từng crop</tspan></text><rect x="110" y="495" width="470" height="100" rx="10" fill="#ede9fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="345" y="510" font-weight="700">SHARED GSD ENCODER</tspan><tspan x="345" y="530" font-weight="400">Mỗi crop qua frozen CLIP Es + trainable CLIP Ef</tspan><tspan x="345" y="550" font-weight="400">Shared Es weights • shared Ef weights</tspan><tspan x="345" y="570" font-weight="400">Basis V₁,K và V₂,K được tính riêng</tspan><tspan x="345" y="590" font-weight="400">Output: ẑ₁, ẑ₂ ∈ ℝ^(B×d)</tspan></text><rect x="110" y="685" width="470" height="80" rx="10" fill="#ede9fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="345" y="710" font-weight="700">SHARED TRAINABLE PROJECTOR</tspan><tspan x="345" y="730" font-weight="400">d → hidden → D</tspan><tspan x="345" y="750" font-weight="400">Output: e₁, e₂ ∈ ℝ^(B×D)</tspan></text><rect x="110" y="855" width="470" height="105" rx="10" fill="#fee2e2" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="345" y="882.5" font-weight="700">NORMALIZE → BARLOW TWINS LOSS</tspan><tspan x="345" y="902.5" font-weight="400">Chuẩn hóa trên global batch</tspan><tspan x="345" y="922.5" font-weight="400">C = normalized(E₁)ᵀ normalized(E₂) / B</tspan><tspan x="345" y="942.5" font-weight="400">LBT = Σᵢ(1−Cᵢᵢ)² + λBT Σᵢ≠ⱼ Cᵢⱼ²</tspan></text><rect x="30" y="1030" width="630" height="105" rx="10" fill="#fff7ed" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="345" y="1057.5" font-weight="700">RANDOM PROCESSING — CẤU HÌNH KHỞI ĐẦU</tspan><tspan x="345" y="1077.5" font-weight="400">50% JPEG Q∈[80,100]; 35% down/up s∈[0.75,1] → JPEG</tspan><tspan x="345" y="1097.5" font-weight="400">15% identity; random interpolation / JPEG subsampling</tspan><tspan x="345" y="1117.5" font-weight="400">Tất cả processing trước crop; cùng input normalization cho Es và Ef.</tspan></text><rect x="760" y="110" width="800" height="60" rx="10" fill="#ffffff" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1160" y="135" font-weight="700">CHI TIẾT SHARED GSD ENCODER</tspan><tspan x="1160" y="155" font-weight="400">Lặp riêng cho v=1 và v=2, từng ảnh trong batch</tspan></text><rect x="980" y="210" width="360" height="65" rx="10" fill="#dbeafe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1160" y="237.5" font-weight="700">CROP RGB xᵥ</tspan><tspan x="1160" y="257.5" font-weight="400">Sau cùng CLIP preprocessing</tspan></text><rect x="750" y="330" width="370" height="85" rx="10" fill="#e2e8f0" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="935" y="357.5" font-weight="700">FROZEN CLIP Es</tspan><tspan x="935" y="377.5" font-weight="400">Cùng initialization pretrained với Ef</tspan><tspan x="935" y="397.5" font-weight="400">Frozen / eval / no_grad</tspan></text><rect x="1200" y="330" width="370" height="85" rx="10" fill="#ede9fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1385" y="357.5" font-weight="700">TRAINABLE CLIP Ef</tspan><tspan x="1385" y="377.5" font-weight="400">Gradient cập nhật weights</tspan><tspan x="1385" y="397.5" font-weight="400">Hai view dùng cùng Ef</tspan></text><rect x="750" y="465" width="370" height="80" rx="10" fill="#e0f2fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="935" y="490" font-weight="700">SEMANTIC PATCH TOKENS Sᵥ</tspan><tspan x="935" y="510" font-weight="400">Shape: Npatch × d, bỏ CLS</tspan><tspan x="935" y="530" font-weight="400">Tính riêng cho mỗi crop / mỗi ảnh</tspan></text><rect x="1200" y="465" width="370" height="80" rx="10" fill="#ede9fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1385" y="490" font-weight="700">UPDATE FEATURE zᵥ</tspan><tspan x="1385" y="510" font-weight="400">CLS: 1 × d, trước projection head</tspan><tspan x="1385" y="530" font-weight="400">Cùng chiều hidden d với semantic tokens</tspan></text><rect x="750" y="600" width="370" height="95" rx="10" fill="#fef3c7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="935" y="622.5" font-weight="700">PER-CROP SVD (không centering)</tspan><tspan x="935" y="642.5" font-weight="400">Sᵥ = AᵥΣᵥVᵥᵀ</tspan><tspan x="935" y="662.5" font-weight="400">Vᵥ,K: d × K • top-K right singular vectors</tspan><tspan x="935" y="682.5" font-weight="400">K ≤ min(Npatch, d)</tspan></text><rect x="980" y="755" width="440" height="85" rx="10" fill="#fef3c7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1200" y="782.5" font-weight="700">SEMANTIC PROJECTION</tspan><tspan x="1200" y="802.5" font-weight="400">pᵥ = (zᵥ Vᵥ,K) Vᵥ,Kᵀ</tspan><tspan x="1200" y="822.5" font-weight="400">z₁ chỉ dùng V₁,K; z₂ chỉ dùng V₂,K</tspan></text><rect x="980" y="900" width="440" height="90" rx="10" fill="#dcfce7" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1200" y="920" font-weight="700">SUPPRESSION → GIỮ FEATURE CÒN LẠI</tspan><tspan x="1200" y="940" font-weight="400">ẑᵥ = zᵥ − α pᵥ</tspan><tspan x="1200" y="960" font-weight="400">α=1: phần trực giao; 0&lt;α&lt;1: suppress một phần</tspan><tspan x="1200" y="980" font-weight="400">Vᵥ,K stop-gradient • backprop qua zᵥ → Ef</tspan></text><rect x="750" y="1040" width="820" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="1160" y="1065" font-weight="700">FIT GMM &amp; INFERENCE</tspan><tspan x="1160" y="1085" font-weight="400">Mỗi test crop cũng chạy Es → SVD và Ef → suppression; bỏ projector.</tspan><tspan x="1160" y="1105" font-weight="400">Fit lại GMM bằng cùng representation ẑ. Không cần ghép test batch để tạo basis.</tspan><tspan x="1160" y="1125" font-weight="400">Chi phí online: cả Es, Ef và SVD cho từng crop.</tspan></text><rect x="30" y="1195" width="1540" height="100" rx="10" fill="#f8fafc" stroke="#64748b"/><text text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#0f172a"><tspan x="800" y="1220" font-weight="700">QUY ƯỚC &amp; GIỚI HẠN</tspan><tspan x="800" y="1240" font-weight="400">Shared = cùng Es weights, cùng Ef weights, cùng thuật toán GSD / K / α; không dùng chung basis giữa hai view.</tspan><tspan x="800" y="1260" font-weight="400">Chọn cùng backbone và cùng hidden layer cho Es / Ef. SVD dùng patch tokens; update feature dùng CLS trong cùng không gian hidden.</tspan><tspan x="800" y="1280" font-weight="400">Đây là thiết kế đề xuất cần ablation, không phải tái lập đầy đủ GSD paper. Control: α=0; chốt backbone, K, α, crop size, D và λBT.</tspan></text></svg>
